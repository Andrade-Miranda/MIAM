# General
dataroot: Task2212_OTLowRegISO # change la task
yh_run_model: Train
dataset_mode: nnUNet
TrainConfig: DefaultConfig # config default for segmetnation
plan: nnUNetPlansv2.1_plans_3D.pkl # check to modify more plaining preprocessing
Deterministic: True
loadsplit: splits_final.json #splits_final.json    #otrosplit.json use default value
pretrained: None
name: ${TrainConfig}_default
DeepSupervision: False

# model setting
encoder: UNETR #MCNN_h+VIT_n #UNETR #UNETR_MAE
imageSize: [96,96,96]
region: [None]
patchSize: 16 #16
feature_size: 16
num_layers: 12
mlp_dim: 3072
num_heads: 12
hidden_size: 768
norm_name: instance
drop_path_rate: 0.1


#trainer
num_training_steps_per_epoch: 10 #num de step training
num_validation_steps_per_epoch: 5 #num de step validation
validate_min_epoch: 1
gpu_ids: 0
fold: 0
input_nc: 3
output_nc: 1 # number of object to segment one class vs multi-lass
epochs: 5 # number of epochs
amsgrad: True
loss_option: DiceFocalLoss #DiceCELoss # check to validate other loss
lr: 1e-3
sigmoid: True # to check since I am not sure 
batchSize: 1
Val_batchSize: 1
VAL_AMP: False
debug: False


# training schedule
sched: None #cosine_anneal
warmup_epochs: 1
dr: 0.2

#Optimizer
weight_decay: 0.05
opt: adamw 
opt_betas: [0.9,0.95]


# wandb
project: LocalTrials
enable_wandb: False
nameRun: ${name}_trial1

# Postprocessing setting
postprocessing: Picai_Postprocessing # improve the function
postpro_dir: /home/gustavo/Code/Git_workspace/MIAM/nnUNet/data/nnUnet_raw/nnUNet_raw_data/Task2210_OTLowRegime/labels-WG-Tr #
Conn_comp: False

