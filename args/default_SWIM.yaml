# General
dataroot: Task2210_OTLowRegime
yh_run_model: Train
dataset_mode: nnUNet
TrainConfig: DefaultConfig
plan: nnUNetPlansv2.1_plans_3D.pkl
Deterministic: True
loadsplit: None
name: ${TrainConfig}_default


# model setting
encoder: SwinTrans3D #UNETR_MAE
imageSize: [96,96,96]
region: [None]
patchSize: 2
num_layers: 12
mlp_dim: 3072
num_heads: 12
hidden_size: 48
norm_name: instance
drop_path_rate: 0.1


#trainer
num_training_steps_per_epoch: 10
num_validation_steps_per_epoch: 2
validate_min_epoch: 1
gpu_ids: 0
fold: 0
input_nc: 3
output_nc: 1
epochs: 10
amsgrad: True
loss_option: DiceCELoss
lr: 1e-3
postprocessing: Picai_Postprocessing
sigmoid: True
batchSize: 1
Val_batchSize: 1
VAL_AMP: False
debug: False


# training schedule
sched: None
warmup_epochs: 10
warmup_lr: 1e-05
dr: 0.1

#Optimizer
weight_decay: 0.05
opt: adamw 
opt_betas: [0.9,0.95]



# wandb
project: LocalTrials
enable_wandb: False
nameRun: ${TrainConfig}_UNETR_trial1

